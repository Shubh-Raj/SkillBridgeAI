name: Supabase Keepalive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping keepalive endpoint
        run: |
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" https://skill-bridge-ai-iota.vercel.app/api/keepalive)

          echo "Response status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Keepalive ping failed with status $STATUS"
            exit 1
          fi

          echo "Keepalive ping successful"
